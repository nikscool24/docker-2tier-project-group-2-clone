---
name: Docker-Scan

on:
  workflow_call:

jobs:
  Image-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      matrix:
        folders: [backend,frontend]
        # project: [api,web]
    steps:
      - name: code-checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  
        
      - name: Build Docker Images
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/myproject-${{ matrix.folders }} .
        working-directory: ./${{ matrix.folders }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/myproject-${{ matrix.folders }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ vars.DOCKERHUB_USERNAME }}/myproject-${{ matrix.folders }}
          only-severities: critical
          exit-code: true    
           
      - name: Push Docker Image ${{ matrix.folders }}
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/myproject-${{ matrix.folders }} 