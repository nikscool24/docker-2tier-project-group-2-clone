---
name: DevSecOps

on:
  workflow_dispatch:  
  push:
    branches: [dev]

permissions:
  contents: read
  packages: read
  security-events: write    

jobs:
  Code-Quality: 
    uses: ./.github/workflows/code-quality.yaml
    secrets: inherit   
 
  
  GitLeaks-Scanner:
    needs: Code-Quality
    uses: ./.github/workflows/gitleaks.yaml 
    secrets: inherit

  SonarQube:
    needs: GitLeaks-Scanner
    uses: ./.github/workflows/Sonarqube.yaml
    secrets: inherit

  Docker-Scan:
    needs: SonarQube
    uses: ./.github/workflows/docker-scan.yaml
    secrets: inherit

    
    
   