---
name: SonarQube

on:
  workflow_call:

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folders: [backend,frontend]
    steps:
      - name: code-checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          