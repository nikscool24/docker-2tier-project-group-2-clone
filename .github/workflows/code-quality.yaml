---
name: Code-Quality

on:
  workflow_call:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-linter: [flake8, pylint, ruff, mypy, pytype, fixit, pyre]
    permissions:
      contents: read
      packages: read
    steps:
      - name: code-checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
        working-directory: ./backend  
        
      - name: Lintin code 
        uses: advanced-security/python-lint-code-scanning-action@v1
        with:
          linter: ${{ matrix.python-linter }} 

      - name: Set up Node.js 
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install & Run ESLint & Prettier
        run: |
          npm install
          npm run format-fix
          npm run lint -- --fix
        working-directory: ./frontend

      - name: Build dependencies
        run: |
          npm ci
          npm run build --if-present
        working-directory: ./frontend